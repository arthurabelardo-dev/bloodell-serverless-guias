AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Emissão de guias de transporte do Bloodell com dados sintéticos
Globals:
  Function:
    Timeout: 3
    MemorySize: 128
Resources:
  GuiaFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      CodeUri: src/
      Handler: app.lambda_handler
      Events:
        EmitirGuia:
          Type: Api
          Properties:
            Path: /guias
            Method: post
